name: borg
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: borgwarehouse/borgwarehouse:latest
    container_name: borg-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: borg-app
      NEXT_TELEMETRY_DISABLED: 1
      PUID: ${APP_RUN_AS:-1000}
      PGID: ${APP_RUN_AS:-1000}
      FQDN: ${BASE_HOST_NAME:-$HOSTNAME}
      BETTER_AUTH_URL: ${BORG_APP_URL:-https://${BASE_HOST_NAME:-$HOSTNAME}}
      BETTER_AUTH_SECRET: ${APP_SECRET_KEY:-replace-with-a-random-secret-key}
      CRONJOB_KEY: ${APP_API_TOKEN:-replace-with-a-random-32-char-key}
      HIDE_SSH_PORT: ${HIDE_SSH_PORT:-true}
      MAIL_REJECT_SELFSIGNED_TLS: ${EMAIL_SERVER_REJECT_SELF_SIGNED:-true}
      MAIL_SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      MAIL_SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      MAIL_SMTP_FROM: ${EMAIL_SERVER_MAIL_FROM:-no-reply@${BASE_HOST_NAME:-$HOSTNAME}}
      MAIL_SMTP_LOGIN: ${EMAIL_SERVER_LOGIN_NAME:-}
      MAIL_SMTP_PWD: ${EMAIL_SERVER_LOGIN_PASS:-}
    ports:
      - '64901:22'
    volumes:
      - './volumes/config/borg:/home/borgwarehouse/app/config'
      - './volumes/config/ssh:/home/borgwarehouse/.ssh'
      - './volumes/config/ssh_host:/etc/ssh'
      - './volumes/data/borg:/home/borgwarehouse/repos'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.borg-app.entrypoints=http'
      - 'traefik.http.routers.borg-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.borg-app.middlewares=borg-app-https-redirect'
      - 'traefik.http.middlewares.borg-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.borg-app-secure.entrypoints=https'
      - 'traefik.http.routers.borg-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.borg-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.borg-app-secure.service=borg-app'
      - 'traefik.http.services.borg-app.loadbalancer.server.port=3000'
    networks:
      - borg
      - traefik

networks:
  borg:
    name: borg
    external: false
  traefik:
    external: true
